<section class="page-hero"><span>Your Cart</span><h1>Good choices, ready to go.</h1></section><section class="section shell cart-grid"><div><article *ngFor="let p of catalog.cart()" class="cart-row"><img [src]="p.image"><div><h3>{{p.name}}</h3><small>{{p.subtitle}}</small></div><b>₹{{p.price}}</b></article><div *ngIf="catalog.cart().length===0" class="empty">Your cart is empty. Add something pure.</div></div><aside class="summary"><h2>Order Summary</h2><p><span>Subtotal</span><b>₹{{total}}</b></p><p><span>Shipping</span><b>{{total>=999?'FREE':'Calculated at checkout'}}</b></p><hr><p><span>Total</span><b>₹{{total}}</b></p><button class="btn">Proceed to Checkout</button></aside></section>
