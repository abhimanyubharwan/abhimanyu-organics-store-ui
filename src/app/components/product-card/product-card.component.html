<article class="product-card reveal"><div class="product-media"><span *ngIf="product.badge" class="badge">{{product.badge}}</span><button class="wish" (click)="catalog.toggleWish(product.id)">♡</button><a [routerLink]="['/product',product.id]"><img [src]="product.image" [alt]="product.name"></a></div><div class="product-body"><small>{{product.subtitle}}</small><h3>{{product.name}}</h3><div class="rating">★ 4.8 <span>(96)</span></div><div class="price">₹{{product.price}} <del *ngIf="product.mrp">₹{{product.mrp}}</del></div><button class="btn small" (click)="catalog.add(product)">Add to cart</button></div></article>
